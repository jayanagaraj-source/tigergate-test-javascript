# FIX-IAC-028: cluster-admin bound to the default service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: default-is-cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
  - kind: Group
    name: system:authenticated
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
# FIX-IAC-029: wildcard RBAC role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: do-anything
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
