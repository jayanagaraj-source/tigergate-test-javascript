# FIX-IAC-030 / FIX-SEC-021: Secret committed to source with base64 (not encryption) values
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  # base64("SuperSecretP4ssw0rd!")
  database-password: U3VwZXJTZWNyZXRQNHNzdzByZCE=
  # base64("AKIAIOSFODNN7EXAMPLE")
  aws-access-key-id: QUtJQUlPU0ZPRE5ON0VYQU1QTEU=
stringData:
  jwt-secret: super-secret-jwt-key
  github-token: ghp_FIXTUREfixtureFIXTUREfixtureFIXTUREfx
---
# FIX-IAC-031: sensitive values in a ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DATABASE_URL: postgres://admin:SuperSecretP4ssw0rd!@db.default.svc:5432/production
  SMTP_PASSWORD: smtp-fixture-password-123
---
# FIX-IAC-032: Pod with insecure sysctls, hostPath, no seccomp, shareProcessNamespace
apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
spec:
  shareProcessNamespace: true
  securityContext:
    sysctls:
      - name: net.ipv4.ip_forward
        value: "1"
  containers:
    - name: shell
      image: alpine
      command: ["sh", "-c", "sleep infinity"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: root
          mountPath: /host
  volumes:
    - name: root
      hostPath: { path: / }
